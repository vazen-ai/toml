name: Release npm

# Merging a change to the package version stages that version on npm. An npm owner then approves
# it with two-factor authentication.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  pack:
    name: Pack the release
    if: github.repository == 'vazen-ai/toml'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.release.outputs.version }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This commit and the main it was merged into.
          fetch-depth: 2
          persist-credentials: false
      - name: Release a changed version
        id: release
        run: |
          version=$(jq -r .version package.json)
          if [ "$version" != "$(git show HEAD^1:typescript/package.json | jq -r .version)" ]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.release.outputs.version
        with:
          node-version: '26.8.2'
          package-manager-cache: false
      - if: steps.release.outputs.version
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: steps.release.outputs.version
        run: npm run verify
      - name: Pack once
        id: pack
        if: steps.release.outputs.version
        run: |
          npm pkg set "gitHead=$GITHUB_SHA"
          npm pack --json > pack.json
          mv -- "$(jq -er '.[0].filename' pack.json)" package.tgz
          echo "sha256=$(sha256sum package.tgz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Import the packed package as a consumer
        if: steps.release.outputs.version
        run: |
          cd "$(mktemp -d)"
          npm init --yes > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE/typescript/package.tgz"
          node --input-type=module --eval "await import('@vazen-ai/toml')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload
        if: steps.release.outputs.version
        with:
          name: npm-package-${{ steps.release.outputs.version }}
          path: typescript/package.tgz
          if-no-files-found: error
          retention-days: 90

  stage:
    name: Stage on npm
    needs: pack
    if: needs.pack.outputs.version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-release
    # The only job that can request an npm token. It checks out, installs and runs nothing from
    # the repository.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Its npm, 11.19.1, stages packages.
          node-version: '26.8.2'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          merge-multiple: true
      - name: Stage the packed bytes
        env:
          SHA256: ${{ needs.pack.outputs.sha256 }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          printf '%s  package.tgz\n' "$SHA256" | sha256sum --check --strict
          # npm refuses a version it already holds, and one below latest when it can read the registry.
          npm stage publish ./package.tgz --ignore-scripts --provenance --json > staged.json
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Staged, awaiting npm approval

          | | |
          | --- | --- |
          | Package | \`@vazen-ai/toml@$VERSION\` |
          | Stage id | \`$(jq -r '.["@vazen-ai/toml"].stageId' staged.json)\` |
          | Public commit | \`$GITHUB_SHA\` |
          | SHA-256 | \`$SHA256\` |
          | Integrity | \`$(jq -r '.["@vazen-ai/toml"].integrity' staged.json)\` |
          | Artifact | \`npm-package-$VERSION\`, kept 90 days |

          An npm owner checks these, then approves it under Staged Packages on npmjs.com.
          EOF
